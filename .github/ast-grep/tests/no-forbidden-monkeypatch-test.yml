id: no-forbidden-monkeypatch
valid:
  - |-
    def test_cwd(monkeypatch):
        monkeypatch.chdir("/tmp")
  - |-
    def test_env(monkeypatch):
        monkeypatch.setenv("X", "y")
        monkeypatch.delenv("X")
        monkeypatch.undo()
  - |-
    def test_allowed_methods(monkeypatch):
        monkeypatch.chdir("/tmp")
        monkeypatch.setenv("X", "y", prepend=":")
        monkeypatch.delenv("X", raising=False)
        monkeypatch.undo()
